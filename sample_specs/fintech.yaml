openapi: "3.0.3"
info:
  title: FinTech Mock API (Vulnerable - for Vigilant-API testing)
  version: "1.0.0"

servers:
  # Use 127.0.0.1 (not "localhost") so the scanner connects straight to IPv4.
  # On Windows "localhost" resolves to IPv6 ::1 first; because the mock server
  # binds IPv4-only, every request stalls ~2s on the failing ::1 attempt before
  # falling back - turning a ~15s demo scan into minutes. The integration test
  # already targets 127.0.0.1 for the same reason.
  - url: http://127.0.0.1:5000

paths:

  /transactions/{id}:
    get:
      summary: Get a transaction by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      security:
        - BearerAuth: []

  /profile/{user_id}:
    get:
      summary: Get user profile
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: integer
      security:
        - BearerAuth: []

  /fetch:
    get:
      summary: Server-side URL fetch (SSRF vulnerable - query param)
      parameters:
        - name: url
          in: query
          required: true
          schema:
            type: string
      security:
        - BearerAuth: []

  /proxy:
    get:
      summary: Server-side proxy fetch (SSRF vulnerable - header param)
      parameters:
        - name: X-Target-URL
          in: header
          required: true
          schema:
            type: string
      security:
        - BearerAuth: []

  /transfer:
    post:
      summary: Transfer funds between accounts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                from_account_id: { type: integer }
                to_account_id:   { type: integer }
                amount:          { type: number }
      security:
        - BearerAuth: []

  /export:
    get:
      summary: Export transaction data (parameter pollution vulnerable)
      parameters:
        - name: id
          in: query
          required: true
          schema:
            # Declared as array to reflect that the server accepts multiple
            # ?id= values (e.g. ?id=1&id=2).  The mock server uses the last
            # value - no ownership check performed on either value.
            type: array
            items:
              type: integer
      security:
        - BearerAuth: []

  /resource/{ref}:
    get:
      summary: Get resource by indirect reference (base64/hex/int - indirect reference vulnerable)
      parameters:
        - name: ref
          in: path
          required: true
          schema:
            type: string
      security:
        - BearerAuth: []

  /user/update:
    post:
      summary: Update user profile (mass assignment vulnerable)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      security:
        - BearerAuth: []
    put:
      summary: Update user profile PUT (mass assignment vulnerable)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      security:
        - BearerAuth: []
    patch:
      summary: Update user profile PATCH (mass assignment vulnerable)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      security:
        - BearerAuth: []

  /account/profile:
    get:
      summary: Get account profile (read-back for mass-assignment persistence)
      security:
        - BearerAuth: []
    patch:
      summary: Update account profile (mass assignment - persists, not just echoes)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      security:
        - BearerAuth: []

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
