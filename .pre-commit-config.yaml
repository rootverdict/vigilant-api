repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: ruff check
        language: system
        types: [python]
      - id: mypy
        name: mypy
        # No path argument: an explicit path overrides the `files` setting in
        # pyproject.toml, which would silently check less than CI does.
        entry: mypy
        language: system
        pass_filenames: false
        types: [python]
